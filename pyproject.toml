[project]
name = "anthropic-course"
version = "0.1.0"
description = ""
authors = [
    {name = "Joel Osgood",email = "joelosgood@ehawksolutions.com"}
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "ipykernel (>=7.2.0,<8.0.0)",
    "anthropic (>=0.97.0,<0.98.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "jupyterlab (>=4.5.7,<5.0.0)",
    "sentence-transformers (>=5.4.1,<6.0.0)",
    "torch (>=2.6.0,<3.0.0)",
    "numpy (>=2.1.0,<3.0.0)",
    "huggingface-hub (>=0.27.0,<1.0.0)",
    "uv (>=0.11.14,<0.12.0)",
    "cli-project"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
cli-project = { path = "artifacts/cli_project", develop = true }

[tool.uv]
package = false

[tool.uv.sources]
cli-project = { path = "artifacts/cli_project", editable = true }
